# LexOS Docker Compose — 应用层（U1/U2/U3）
#
# 前置：Supabase 栈（云项目或自建）。将连接信息写入 `.env.docker`（见 `.env.docker.example`）。
#
# 首次部署：
#   copy .env.docker.example .env.docker   # 填写 Supabase / AI 等变量
#   docker compose run --rm migrate
#   docker compose --profile init run --rm seed-admin
#   docker compose up -d --build
#
# 访问：http://localhost:3000

name: lexos

services:
  migrate:
    build:
      context: .
      target: migrate
    env_file: .env.docker
    environment:
      NODE_ENV: production
    restart: "no"

  seed-admin:
    profiles: ["init"]
    build:
      context: .
      target: seed-admin
    env_file: .env.docker
    environment:
      NODE_ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: .
      target: api
    env_file: .env.docker
    environment:
      NODE_ENV: production
      # 容器内健康检查与监听端口解析
      API_URL: http://127.0.0.1:4000
    ports:
      - "${LEXOS_API_PORT:-4000}:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: .
      target: web
      args:
        API_URL: http://api:4000
    env_file: .env.docker
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:-http://localhost:3000}
      # Next 服务端反代 U2（须与 build-arg API_URL 一致）
      API_URL: http://api:4000
    ports:
      - "${LEXOS_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  worker-pipeline:
    build:
      context: .
      target: worker-pipeline
    env_file: .env.docker
    environment:
      NODE_ENV: production
      FFMPEG_PATH: ffmpeg
      WORKER_TMP_DIR: /tmp/lexos
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - worker-tmp:/tmp/lexos

  worker-scheduler:
    build:
      context: .
      target: worker-scheduler
    env_file: .env.docker
    environment:
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  worker-tmp:
